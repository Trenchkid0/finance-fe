<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#131926" />
      <stop offset="55%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#06080E" />
    </linearGradient>
    <linearGradient id="rim" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.55" />
    </linearGradient>
    <linearGradient id="primary" x1="14" y1="48" x2="48" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="55%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="secondary" x1="22" y1="34" x2="52" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
    <linearGradient id="fold" x1="16" y1="18" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.25" />
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="40%" r="60%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </radialGradient>
  </defs>

  <!-- Organic Superellipse Squircle -->
  <path
    d="M 32 3 C 51 3, 61 13, 61 32 C 61 51, 51 61, 32 61 C 13 61, 3 51, 3 32 C 3 13, 13 3, 32 3 Z"
    fill="url(#bg)"
    stroke="url(#rim)"
    stroke-width="1.8"
  />

  <!-- Top Specular Highlight -->
  <path
    d="M 14 10 C 22 6.5, 42 6.5, 50 10"
    stroke="rgba(255,255,255,0.18)"
    stroke-width="1.2"
    stroke-linecap="round"
  />

  <!-- Stem Ribbon Fold -->
  <path
    d="M 17 48 C 15.5 39, 16.5 25, 22 18.5 C 25.5 14.5, 29.5 14, 31 18 C 25 22, 23.5 34, 24.5 45 C 25 49, 18.5 51.5, 17 48 Z"
    fill="url(#fold)"
  />

  <!-- Secondary Ascending Tail Ribbon -->
  <path
    d="M 25.5 33.5 C 31 32, 36.5 34.5, 40.5 40 C 43.5 44, 46.5 45.5, 50.5 41.5 C 52 40, 53.5 41.5, 52.5 44 C 49.5 50.5, 41.5 51.5, 35.5 45.5 C 31.5 41.5, 28.5 38.5, 24 38 C 21.5 37.7, 22.5 34.3, 25.5 33.5 Z"
    fill="url(#secondary)"
  />

  <!-- Primary Sweeping R-Ribbon -->
  <path
    d="M 17.5 47.5 C 16.5 35, 19.5 19.5, 29.5 14.5 C 38.5 10, 49.5 14.5, 49.5 24 C 49.5 32.5, 41 37.5, 29.5 36.5 C 25.5 36.1, 25.5 31.5, 29.5 31.5 C 37 31.5, 42.5 28.5, 42.5 23.8 C 42.5 18.5, 36.5 16.5, 31 19.5 C 24.5 23, 23.5 35, 24.2 46.5 C 24.5 50.5, 18 51, 17.5 47.5 Z"
    fill="url(#primary)"
  />

  <!-- Sovereign Emerald Core -->
  <circle cx="33.5" cy="25.2" r="3.6" fill="url(#core)" />
  <circle cx="49.5" cy="13.5" r="1.8" fill="#6ee7b7" opacity="0.9" />
</svg>
